<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI外構シミュレーション｜橋本工業</title>
<meta name="description" content="橋本工業の外構デザインシミュレーション。お家の写真と希望する工事を選んで、理想の外構を相談できます。">
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
  color: #26352e;
  background: #f6f6f1;
  line-height: 1.7;
}
header {
  background: #263d35;
  color: white;
  padding: 18px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo { font-size: 20px; font-weight: bold; }
.logo small { display: block; font-size: 10px; letter-spacing: 2px; }
header a { color: white; text-decoration: none; }
main { max-width: 720px; margin: auto; padding: 24px 16px 45px; }
.intro { text-align: center; padding: 22px 0; }
h1 { font-size: 27px; line-height: 1.4; }
.intro p { color: #606960; font-size: 14px; }
.step {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin: 18px 0;
  box-shadow: 0 3px 12px #0000000a;
}
h2 { font-size: 18px; margin-top: 0; }
.number { color: #748b68; margin-right: 7px; }
.upload {
  display: block;
  border: 2px dashed #a6b3a1;
  border-radius: 10px;
  padding: 25px 12px;
  text-align: center;
  background: #fafbf8;
  cursor: pointer;
}
.upload input { display: block; margin: 12px auto 0; max-width: 100%; }
#preview { display: none; width: 100%; max-height: 350px; object-fit: contain; margin-top: 15px; border-radius: 8px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { display: flex; align-items: center; gap: 8px; border: 1px solid #ddd; border-radius: 8px; padding: 12px 9px; font-size: 14px; }
select, textarea { width: 100%; padding: 12px; border: 1px solid #ccd1ca; border-radius: 8px; font: inherit; background: white; }
textarea { min-height: 90px; }
.primary {
  display: block; width: 100%; border: 0; border-radius: 8px;
  padding: 15px; background: #263d35; color: white;
  font-size: 16px; font-weight: bold; cursor: pointer;
}
#result { display: none; white-space: pre-wrap; background: #eef2e9; padding: 15px; border-radius: 8px; margin-top: 15px; overflow-wrap: anywhere; }
.note { font-size: 12px; color: #777; }
footer { text-align: center; padding: 24px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">橋本工業<small>EXTERIOR &amp; GARDEN</small></a>
  <a href="index.html">トップへ戻る</a>
</header>

<main>
  <section class="intro">
    <p>HASHIMOTO KOGYO</p>
    <h1>AI外構シミュレーション</h1>
    <p>理想のお家まわりを、一緒にイメージしてみませんか？</p>
  </section>

  <section class="step">
    <h2><span class="number">01</span>お家の写真を選ぶ</h2>
    <label class="upload">
      写真を選択してください
      <input id="photo" type="file" accept="image/*">
    </label>
    <img id="preview" alt="選択したお家の写真">
    <p class="note">選んだ写真はこの画面でプレビューするだけで、サーバーには送信されません。</p>
  </section>

  <section class="step">
    <h2><span class="number">02</span>希望する工事を選ぶ</h2>
    <div class="choices">
      <label class="choice"><input type="checkbox" value="カーポート">カーポート</label>
      <label class="choice"><input type="checkbox" value="フェンス">フェンス</label>
      <label class="choice"><input type="checkbox" value="ブロック塀">ブロック塀</label>
      <label class="choice"><input type="checkbox" value="駐車場・土間コンクリート">駐車場・土間</label>
      <label class="choice"><input type="checkbox" value="庭づくり・人工芝">庭・人工芝</label>
      <label class="choice"><input type="checkbox" value="門柱・金物">門柱・金物</label>
    </div>
  </section>

  <section class="step">
    <h2><span class="number">03</span>好みのデザインを選ぶ</h2>
    <select id="style">
      <option value="">デザインを選択してください</option>
      <option>モダン・高級感</option>
      <option>シンプル・スタイリッシュ</option>
      <option>ナチュラル・植栽多め</option>
      <option>和風・落ち着いた雰囲気</option>
      <option>予算重視・シンプル</option>
    </select>
  </section>

  <section class="step">
    <h2><span class="number">04</span>ご希望・ご予算</h2>
    <label for="budget">予算の目安</label>
    <select id="budget">
      <option>相談して決めたい</option>
      <option>50万円未満</option>
      <option>50万〜100万円</option>
      <option>100万〜200万円</option>
      <option>200万円以上</option>
    </select>
    <p></p>
    <label for="details">その他のご希望（任意）</label>
    <textarea id="details" placeholder="例：車2台分のカーポートが欲しい"></textarea>
  </section>

  <section class="step">
    <h2><span class="number">05</span>選んだ内容を確認</h2>
    <button class="primary" id="showResult" type="button">選択内容を確認する</button>
    <div id="result"></div>
    <button class="primary" id="generateAI" type="button">
  AIシミュレーション開始
</button>
<p id="aiStatus" class="note"></p>
<img id="aiResult" alt="AI外構シミュレーション結果"
     style="display:none;width:100%;margin-top:15px;border-radius:8px;">
  </section>

  <a class="primary" style="text-align:center;text-decoration:none" href="https://forms.gle/ADBg7HfEejVwyByf9">橋本工業に相談する</a>
  <p style="text-align:center"><a href="tel:08020680965">電話で相談：080-2068-0965</a></p>
</main>

<footer>© 橋本工業</footer>

<script>
const photo = document.getElementById("photo");
const preview = document.getElementById("preview");

photo.addEventListener("change", function () {
  const file = photo.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("画像ファイルを選択してください。");
    photo.value = "";
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
});

document.getElementById("showResult").addEventListener("click", function () {
  const work = Array.from(document.querySelectorAll('.choices input:checked'))
    .map(item => item.value);
  const style = document.getElementById("style").value || "未選択";
  const budget = document.getElementById("budget").value;
  const details = document.getElementById("details").value || "なし";

  const result = document.getElementById("result");
  result.textContent =
    "【ご希望の内容】\n" +
    "工事：" + (work.length ? work.join("、") : "未選択") + "\n" +
    "デザイン：" + style + "\n" +
    "予算：" + budget + "\n" +
    "その他：" + details;
  result.style.display = "block";
});
</script>
</body>
</html>
